<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title description">
  <title id="title">RIAEvangelist NPM download telemetry</title>
  <desc id="description">4,607,333 weekly, 23,662,618 monthly, and 260,994,962 yearly downloads across 40 displayed modules, followed by the top five modules.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151226"/>
      <stop offset="1" stop-color="#090813"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff4fa7"/>
      <stop offset="0.5" stop-color="#8c6cff"/>
      <stop offset="1" stop-color="#39e6e6"/>
    </linearGradient>
  </defs>
  <style>
