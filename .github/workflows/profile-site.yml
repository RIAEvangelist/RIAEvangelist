name: Refresh telemetry and deploy profile site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profile-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh verified public telemetry
        env:
          PROFILE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            node scripts/update-profile-data.mjs --max-age-hours=1
            node scripts/update-npm-history.mjs --max-age-hours=1
          else
            node scripts/update-profile-data.mjs --force
            node scripts/update-npm-history.mjs --force
          fi

      - name: Validate the refreshed site and data archive
        run: |
          node --check app.js
          node --check scripts/update-profile-data.mjs
          node --check scripts/update-npm-history.mjs
          node --test tests/profile-site.test.mjs
          git diff --check

      - name: Record a refreshed snapshot when needed
        run: |
          if [[ -n "$(git status --porcelain -- README.md data/npm-stats.json data/repos.json data/npm-history assets/npm-downloads.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- README.md data/npm-stats.json data/repos.json data/npm-history assets/npm-downloads.svg
            git commit -m "chore: refresh public profile telemetry"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the static profile site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
